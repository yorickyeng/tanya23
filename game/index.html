<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#f5eee7">
  <title>tanya23</title>
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./screen.css">
</head>
<body>
  <main id="stage" class="stage" data-state="loading" aria-label="Игровое окно">
    <canvas id="canvas" width="800" height="600" tabindex="0" aria-label="Игровое окно"></canvas>
    <div id="loading" class="veil loading" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <progress id="progress" max="100" value="0" aria-label="Загрузка"></progress>
      <span class="sr-only">Один момент…</span>
    </div>
    <button id="continue" class="continue" type="button" aria-label="Продолжить" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7Z"/></svg>
    </button>
    <div id="failure" class="veil failure" role="alert" hidden>
      <p>Не получилось загрузить. Попробуй ещё раз.</p>
      <button id="retry" class="retry" type="button" aria-label="Повторить загрузку">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M19 12a7 7 0 1 0-2 5M20 12l-4-5"/></svg>
      </button>
    </div>
  </main>
  <pre id="log" hidden aria-hidden="true"></pre>
  <script src="./runtime/browserfs.boxedwine.js"></script>
  <script type="module" src="./engine.js?v=2"></script>
</body>
</html>
