<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#f5eee7">
  <title>tanya23</title>
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./screen.css?v=5">
</head>
<body>
  <main id="player" class="player">
    <header class="toolbar" data-ui>
      <a id="home" class="control home" href="../index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg><span>На главную</span></a>
      <span class="status" id="player-status" role="status"><i aria-hidden="true"></i><span>Подготовка…</span></span>
      <button id="fullscreen" class="control" type="button" aria-label="На весь экран" title="На весь экран" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg><span>На весь экран</span></button>
    </header>
    <div class="screen-frame">
      <section id="stage" class="stage" data-state="loading" aria-label="Игровое окно">
        <canvas id="canvas" width="800" height="600" tabindex="0" aria-label="Игровое окно"></canvas>
        <div id="loading" class="veil loading" role="status" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span>
          <progress id="progress" max="100" value="0" aria-label="Загрузка"></progress>
          <p id="load-detail">Готовим первый запуск…</p>
        </div>
        <button id="continue" class="continue" type="button" aria-label="Продолжить" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7Z"/></svg></button>
        <div id="failure" class="veil failure" role="alert" hidden>
          <p>Не получилось загрузить. Попробуй ещё раз.</p>
          <button id="retry" class="retry" type="button" aria-label="Повторить загрузку"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M19 12a7 7 0 1 0-2 5M20 12l-4-5"/></svg></button>
        </div>
      </section>
    </div>
    <footer class="controls-legend" data-ui aria-label="Управление">
      <span><kbd>←</kbd><kbd>→</kbd> движение</span><span><kbd>Z</kbd> прыжок</span><span><kbd>Пробел</kbd> удар</span><span><kbd>Esc</kbd> меню</span>
    </footer>
    <p id="fullscreen-message" class="sr-only" role="status"></p>
  </main>
  <pre id="log" hidden aria-hidden="true"></pre>
  <script type="module" src="./entry.js?v=10"></script>
</body>
</html>
